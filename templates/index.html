
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Customer Inquiry Triage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1f2937;
            text-align: center;
        }

        .description {
            color: #6b7280;
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 25px 0 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 130px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #ecfdf5;
            border-left: 5px solid #10b981;
            border-radius: 6px;
        }

        .result h2 {
            margin-top: 0;
            color: #065f46;
        }

        .message {
            overflow-wrap: anywhere;
            color: #374151;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <p style="text-align: right;">
    <a href="/dashboard">View Inquiry Dashboard</a>
</p>
        <h1>Smart Customer Inquiry Triage</h1>

        <p class="description">
            Submit a customer inquiry and let the system
            automatically assign it to a category.
        </p>

        <form method="POST">
            <label for="message">Customer Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Example: I need a refund for my payment..."
                required>{{ customer_message }}</textarea>

            <button type="submit">Classify Inquiry</button>
        </form>

        {% if category %}
            <div class="result">
                <h2>Classification Result</h2>

                <p class="message">
                    <strong>Message:</strong> {{ customer_message }}
                </p>

                <p>
                    <strong>Category:</strong> {{ category }}
                </p>
            </div>
        {% endif %}

        <footer>
            Built with Python and Flask
        </footer>
    </div>
</body>
</html>
